spring.application.name=AIResumeAnalyzer

# Active profile: defaults to "local" for dev convenience (picks up
# application-local.properties, which is gitignored and holds the real
# rapidapi.key). Set SPRING_PROFILES_ACTIVE explicitly in production so the
# local profile does not activate there (its file isn't deployed anyway).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_ai?allowEncodingChanges=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Disable timezone parameter to avoid PostgreSQL timezone conflicts
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Set timezone to UTC to avoid timezone negotiation issues
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# No default: this is a secret. Set RAPIDAPI_KEY as an env var in production;
# for local dev, put it in application-local.properties instead.
rapidapi.key=${RAPIDAPI_KEY:}
rapidapi.host=${RAPIDAPI_HOST:jsearch.p.rapidapi.com}
